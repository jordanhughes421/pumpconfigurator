services:
  - type: web
    runtime: static
    name: jordanhughes-pumpconfigurator-web
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @magnum-opus/shared build && pnpm --filter @magnum-opus/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://jordanhughes-pumpconfigurator-api.onrender.com

  - type: web
    runtime: node
    name: jordanhughes-pumpconfigurator-api
    plan: starter
    region: virginia
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @magnum-opus/shared build && pnpm --filter @magnum-opus/api exec prisma generate && pnpm --filter @magnum-opus/api build
    preDeployCommand: pnpm --filter @magnum-opus/api exec prisma migrate deploy
    startCommand: pnpm --filter @magnum-opus/api start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pumpconfigurator-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://jordanhughes-pumpconfigurator-web.onrender.com

databases:
  - name: pumpconfigurator-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    databaseName: magnumopus
    user: magnumopus
    ipAllowList: []
